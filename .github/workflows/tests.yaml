---
name: tests

on:
  workflow_dispatch:

  push:
    branches-ignore:
    - 'development/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '16'
        cache: 'yarn'
    - name: install dependencies
      run: yarn install --frozen-lockfile
#    - name: lint javascript
#      run: yarn --silent lint -- --max-warnings 0
    - name: run tests
      run: yarn test
